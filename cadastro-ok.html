<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro recebido | Kiiro</title>
<meta name="theme-color" content="#FFC800">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  body{background:var(--paper);min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center}
  .ok{width:80px;height:80px;border-radius:50%;background:var(--sun);color:var(--ink);box-shadow:0 0 0 8px var(--sun-soft);display:grid;place-items:center;margin:0 auto 1.2rem}
  .ok svg{width:40px;height:40px}
  h1{font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700;line-height:1.15}
  p{margin:.8rem auto 1.6rem;max-width:22rem;font-weight:500}
</style>
</head>
<body>
  <main>
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Cadastro recebido!</h1>
    <p>Em poucos minutos seu perfil aparece na lista de profissionais da Kiiro. Fique de olho no WhatsApp.</p>
    <p style="font-size:.85rem;margin-top:-.8rem">Para mudar algo depois, é só preencher o cadastro de novo com o mesmo WhatsApp.</p>
    <a class="btn btn-ink" href="./">Ver profissionais</a>
  </main>
</body>
</html>
