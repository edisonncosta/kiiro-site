[build]
  publish = "."
  functions = "netlify/functions"

# endereços curtos
[[redirects]]
  from = "/avaliar"
  to = "/avaliar.html"
  status = 200

[[redirects]]
  from = "/cadastro"
  to = "/cadastro.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/anunciar"
  to = "/anunciar.html"
  status = 200

[[redirects]]
  from = "/avisos"
  to = "/avisos.html"
  status = 200

[[redirects]]
  from = "/painel"
  to = "/.netlify/functions/painel"
  status = 200

# links antigos
[[redirects]]
  from = "/profissionais"
  to = "/"
  status = 301

[[redirects]]
  from = "/profissionais.html"
  to = "/"
  status = 301

# o aviso do celular precisa sempre da versão nova do service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
